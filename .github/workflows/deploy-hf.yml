name: Deploy to Hugging Face

# Publishes the app to a Hugging Face Docker Space after CI passes on main.
# One-time setup (see docs/development/deployment.md):
#   - repository variable HF_SPACE = "<hf-username>/<space-name>"
#   - repository secret   HF_TOKEN = a Hugging Face access token with "write" permission
# Until both exist, this workflow skips itself.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      HF_SPACE: ${{ vars.HF_SPACE }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check token
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::Add the HF_TOKEN repository secret first."; exit 1; fi

      - name: Assemble the Space
        run: |
          mkdir space
          cp -r coin_buddy Dockerfile pyproject.toml config.yaml config.hosted.yaml LICENSE space/
          find space -name "__pycache__" -prune -exec rm -rf {} +
          cat > space/README.md <<'EOF'
          ---
          title: Coin Buddy
          emoji: 🪙
          colorFrom: indigo
          colorTo: green
          sdk: docker
          app_port: 8000
          pinned: true
          short_description: Explainable crypto signals with honest backtesting
          ---

          # Coin Buddy

          Crypto signals from RSI, MACD, Bollinger Bands and Reddit sentiment, with an honest backtester.

          - Source code: https://github.com/CharanChintalachervu/CoinBuddy
          - Documentation: https://charanchintalachervu.github.io/CoinBuddy/

          Educational tool. Not financial advice. Coin Buddy never places trades.

          © 2025–2026 Charan Chintalachervu. All rights reserved.
          EOF

      - name: Push to Hugging Face
        working-directory: space
        run: |
          git init -q -b main
          git config user.name "Charan Chintalachervu"
          git config user.email "213742693+CharanChintalachervu@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          owner="${HF_SPACE%%/*}"
          git push --force "https://${owner}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Deployed to https://huggingface.co/spaces/${HF_SPACE}"
