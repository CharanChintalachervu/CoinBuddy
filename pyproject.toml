[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coin-buddy"
version = "2.0.0"
description = "Crypto market signals from technical indicators and social sentiment, with honest backtesting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary. Copyright (c) 2025-2026 Charan Chintalachervu. All rights reserved. See LICENSE." }
authors = [{ name = "Charan Chintalachervu" }]
dependencies = [
    "ccxt>=4.3",
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "plotly>=5.20",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "vaderSentiment>=3.3.2",
]

[project.optional-dependencies]
reddit = ["praw>=7.7"]                       # authenticated Reddit API (optional, public JSON works without it)
finbert = ["transformers>=4.40", "torch"]    # stronger sentiment model, ~1.5 GB download, CPU is fine
dev = ["pytest>=8,<9", "ruff>=0.6", "ta>=0.11", "httpx2>=2.0"]  # ta cross-checks indicator math; httpx2 drives API tests
# Documentation website. Pins: MkDocs 2.0 drops plugin/theme support, and pymdown-extensions 12
# changed an API that mkdocstrings (on Python 3.10) still uses.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.26", "pymdown-extensions>=10,<12"]

[project.scripts]
coin-buddy = "coin_buddy.cli:main"

[tool.setuptools.packages.find]
include = ["coin_buddy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # lets tests import `tests.conftest` whether run as `pytest` or `python -m pytest`
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]

[tool.setuptools.package-data]
coin_buddy = ["web/static/*"]
